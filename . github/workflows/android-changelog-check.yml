name: Android — Changelog bump check

on:
  pull_request:
    branches: [main]
    paths:
      - "android/**/*.kt"
      - "android/**/*.xml"
      - "android/**/*.gradle.kts"
      - "android/gradle/libs.versions.toml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if android/CHANGELOG.md was not updated
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if echo "$CHANGED" | grep -q "^android/CHANGELOG.md$"; then
            echo "android/CHANGELOG.md updated alongside code changes — good."
          else
            echo "::error::Android code was changed but android/CHANGELOG.md was not updated. Add a changelog entry before merging."
            exit 1
          fi
