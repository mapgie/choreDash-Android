name: Android — Build & Release APK

on:
  pull_request:
    branches: [main]
    paths:
      - "android/**/*.kt"
      - "android/**/*.xml"
      - "android/**/*.gradle.kts"
      - "android/gradle/libs.versions.toml"
      - "android/gradle/wrapper/**"
      - "android/gradle.properties"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version is new
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep 'versionName' android/app/build.gradle.kts | grep -oP '"[^"]+"' | tr -d '"')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          if gh release view "android-v${VERSION}" &>/dev/null; then
            echo "::error::android-v${VERSION} is already released. Bump versionName (and versionCode) in android/app/build.gradle.kts before merging."
            exit 1
          fi
          echo "Version ${VERSION} is new."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Run unit tests
        run: ./gradlew :app:test --no-daemon

      - name: Run lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Rename APK and create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_NAME="Dash-${{ env.VERSION }}-debug.apk"
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/${APK_NAME}
          gh release create "android-v${{ env.VERSION }}" \
            "android/app/build/outputs/apk/debug/${APK_NAME}" \
            --title "Dash Android v${{ env.VERSION }}" \
            --notes "Debug build — enable 'Install unknown apps' in Android settings to sideload."
