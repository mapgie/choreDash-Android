name: Licence screen sync check
on:
  pull_request:
    branches: [main]
    paths:
      - "gradle/libs.versions.toml"
permissions:
  contents: read
jobs:
  check:
    uses: mapgie/android-Actions/.github/workflows/license-sync.yml@252cf0054ab486b6aa3e87563bc12146d97ff891
    with:
      screen-file: LicensesScreen.kt
      screen-path: app/src/main/java/com/mapgie/dash/ui/screens/licenses/LicensesScreen.kt
