name: Licence screen sync check
on:
  pull_request:
    branches: [main]
    paths:
      - "gradle/libs.versions.toml"
permissions:
  contents: read
jobs:
  check:
    uses: mapgie/android-Actions/.github/workflows/license-sync.yml@03a8dfd32ef0e703cc1506c1105bdb98f31a29cc
    with:
      screen-file: LicensesScreen.kt
      screen-path: app/src/main/java/com/mapgie/dash/ui/screens/licenses/LicensesScreen.kt
