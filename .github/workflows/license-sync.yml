name: Licence screen sync check
on:
  pull_request:
    branches: [main]
    paths:
      - "gradle/libs.versions.toml"
permissions:
  contents: read
jobs:
  check:
    uses: mapgie/android-Actions/.github/workflows/license-sync.yml@1a6f42d3abb98e085e01ec0803a74e0902b55ff3
    with:
      screen-file: LicensesScreen.kt
      screen-path: app/src/main/java/com/mapgie/dash/ui/screens/licenses/LicensesScreen.kt
