name: Licence screen sync check
on:
  pull_request:
    branches: [main]
    paths:
      - "gradle/libs.versions.toml"
permissions:
  contents: read
jobs:
  check:
    uses: mapgie/android-Actions/.github/workflows/license-sync.yml@55fd01778230063aca02eb208c0a73e33541c497
    with:
      screen-file: LicensesScreen.kt
      screen-path: app/src/main/java/com/mapgie/dash/ui/screens/licenses/LicensesScreen.kt
