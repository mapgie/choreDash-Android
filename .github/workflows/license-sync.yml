name: Licence screen sync check
on:
  pull_request:
    branches: [main]
    paths:
      - "gradle/libs.versions.toml"
permissions:
  contents: read
jobs:
  check:
    uses: mapgie/android-Actions/.github/workflows/license-sync.yml@3be8dd368173a146e2355588bd3e1892ef4dd50f
    with:
      screen-file: LicensesScreen.kt
      screen-path: app/src/main/java/com/mapgie/dash/ui/screens/licenses/LicensesScreen.kt
